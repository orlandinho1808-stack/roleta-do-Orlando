<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roleta do Orlando e da sua namorada linda 🎡❤️</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;
  font-family:Arial,sans-serif;color:white;
  background:radial-gradient(circle at top,#4b185f,#1b0d31 55%,#090612);
}
.app{width:min(1050px,94vw);padding:25px 15px;text-align:center}
h1{font-size:clamp(2rem,6vw,4rem);margin:0 0 5px}
.sub{opacity:.78;margin:0 0 24px}
.layout{display:grid;grid-template-columns:minmax(300px,650px) 300px;gap:28px;align-items:center}
.wheelbox{position:relative;width:min(650px,88vw);aspect-ratio:1;margin:auto}
canvas{width:100%;height:100%;filter:drop-shadow(0 18px 35px #0008)}
.pointer{
 position:absolute;z-index:4;top:-5px;left:50%;transform:translateX(-50%);
 width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent;
 border-top:0;border-bottom:42px solid white;filter:drop-shadow(0 3px 4px #000)
}
.center{
 position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);
 width:82px;height:82px;border-radius:50%;background:white;color:#381343;
 display:grid;place-items:center;font-size:30px;box-shadow:0 0 0 8px #ffffff33
}
.panel{
 background:#ffffff0f;border:1px solid #ffffff1c;border-radius:24px;padding:22px;
 backdrop-filter:blur(12px);box-shadow:0 15px 40px #0005
}
#result{min-height:80px;display:grid;place-items:center;font-size:1.25rem;font-weight:800}
button{
 width:100%;padding:17px;border:0;border-radius:16px;cursor:pointer;
 background:linear-gradient(135deg,#ff4f91,#ff765c);color:white;font-size:1.08rem;
 font-weight:900;box-shadow:0 10px 25px #ff4f9140
}
button:hover{filter:brightness(1.08);transform:translateY(-1px)}
button:disabled{opacity:.55;cursor:not-allowed;transform:none}
.secondary{margin-top:10px;background:#ffffff16;box-shadow:none}
h2{margin-top:0}
ul{list-style:none;padding:0;text-align:left;display:grid;gap:7px}
li{padding:8px 10px;background:#ffffff09;border-radius:9px;font-size:.9rem}
.note{font-size:.8rem;opacity:.6;line-height:1.4}
@media(max-width:800px){.layout{grid-template-columns:1fr}.panel{max-width:650px;margin:auto}}
</style>
</head>
<body>
<div class="app">
<h1>🎡 Roleta do Orlando e da sua namorada linda ❤️</h1>
<p class="sub">Girem e descubram o que vocês vão fazer juntos!</p>

<div class="layout">
<div class="wheelbox">
 <div class="pointer"></div>
 <canvas id="wheel" width="760" height="760"></canvas>
 <div class="center">❤️</div>
</div>

<div class="panel">
<h2>✨ Resultado</h2>
<div id="result">Clique em <b>GIRAR!</b></div>
<button id="spin">🎡 GIRAR A ROLETA</button>
<button id="reset" class="secondary">🔄 Resetar opções</button>
<p class="note">O site evita repetir uma opção até que todas tenham saído.</p>
<ul id="list"></ul>
</div>
</div>
</div>

<script>
const allOptions=[
 "🎵 Adivinhe a música",
 "🛑 Stop/Adedonha",
 "🎨 Desenho misterioso",
 "😎 Emoji secreto",
 "📖 Eu começo, você termina",
 "🎭 Imitar personagens",
 "🤣 Não pode rir",
 "🎮 Jogar Roblox",
 "⛏️ Jogar Minecraft",
 "🎯 Desafio surpresa"
];

const colors=["#ff5c8a","#ff9966","#ffd166","#70d6ff","#8ecae6","#b388ff","#c77dff","#ff70a6","#7bd88f","#f78c6b"];
const canvas=document.getElementById("wheel"),ctx=canvas.getContext("2d");
const result=document.getElementById("result"),spin=document.getElementById("spin"),reset=document.getElementById("reset"),list=document.getElementById("list");
let available=[],rotation=0,spinning=false;

function load(){
 const saved=JSON.parse(localStorage.getItem("roletaCasalDisponiveis")||"null");
 available=saved?.length?saved:[...Array(allOptions.length).keys()];
 updateList(); draw();
}
function save(){localStorage.setItem("roletaCasalDisponiveis",JSON.stringify(available))}
function updateList(){
 list.innerHTML="";
 allOptions.forEach((x,i)=>{
   const li=document.createElement("li");
   li.textContent=(available.includes(i)?"🟢 ":"⚪ ")+x;
   li.style.opacity=available.includes(i)?"1":".4";
   list.appendChild(li);
 });
}
function draw(){
 const n=allOptions.length,arc=Math.PI*2/n,r=canvas.width/2;
 ctx.clearRect(0,0,canvas.width,canvas.height);
 for(let i=0;i<n;i++){
   const a=rotation+i*arc-Math.PI/2;
   ctx.beginPath();ctx.moveTo(r,r);ctx.arc(r,r,r-8,a,a+arc);ctx.closePath();
   ctx.fillStyle=colors[i];ctx.fill();ctx.strokeStyle="#ffffff55";ctx.lineWidth=3;ctx.stroke();
   ctx.save();ctx.translate(r,r);ctx.rotate(a+arc/2);
   ctx.fillStyle="#fff";ctx.font="bold 22px Arial";ctx.textAlign="right";ctx.textBaseline="middle";
   ctx.shadowColor="#0008";ctx.shadowBlur=4;
   let text=allOptions[i]; if(text.length>22) text=text.slice(0,21)+"…";
   ctx.fillText(text,r-30,0);ctx.restore();
 }
}

spin.onclick=()=>{
 if(spinning)return;
 if(!available.length){
   result.textContent="🎉 Todas as opções já saíram!";
   return;
 }
 spinning=true;spin.disabled=true;result.textContent="Girando... 🎡";
 const winner=available[Math.floor(Math.random()*available.length)];
 const n=allOptions.length,arc=2*Math.PI/n;
 const target=-winner*arc-arc/2;
 let delta=target-(rotation%(2*Math.PI));
 delta+=(7+Math.floor(Math.random()*3))*2*Math.PI;
 const start=rotation,end=rotation+delta,duration=4500,t0=performance.now();

 function anim(t){
   const p=Math.min(1,(t-t0)/duration),e=1-Math.pow(1-p,4);
   rotation=start+(end-start)*e;draw();
   if(p<1)requestAnimationFrame(anim);
   else{
     rotation=end;draw();
     result.textContent="✨ "+allOptions[winner]+" ✨";
     available=available.filter(i=>i!==winner);save();updateList();
     spin.disabled=false;spinning=false;
   }
 }
 requestAnimationFrame(anim);
};

reset.onclick=()=>{
 available=[...Array(allOptions.length).keys()];
 save();updateList();result.textContent="Opções resetadas! ❤️";
};

load();
</script>
</body>
</html>
